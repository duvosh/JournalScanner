[workspace]
resolver = "2"
members = ["crates/js-core", "crates/js-native", "crates/js-gui", "crates/js-cli"]

[workspace.package]
edition = "2021"
version = "2.0.5"

[workspace.dependencies]
js-core = { path = "crates/js-core" }
js-native = { path = "crates/js-native" }
windows = "0.61"
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"
memchr = "2"
flate2 = "1"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
lzma-rs = "0.3"
liblzma = "0.4"
regex-automata = "0.4"
ruzstd = "0.8"
lz4_flex = "0.11"
tar = "0.4"
sevenz-rust2 = "0.13"
sha2 = "0.10"
sha1 = "0.10"
crc32fast = "1"
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
rayon = "1"
crossbeam-channel = "0.5"
# yalnızca OpenGL (glow) çizicisi; erişilebilirlik / Linux pencere sistemleri / web özellikleri kapalı
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.31", default-features = false }
rfd = "0.15"
embed-manifest = "1"
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
